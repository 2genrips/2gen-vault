<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <meta name="description" content="VaultSignal — stock alerts, local inventory, scanning, pricing, Card Journey, creator tools and Grail collection intelligence in one collector OS.">
  <meta name="application-name" content="VaultSignal">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="color-scheme" content="dark">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css?v=15.0.0">
  <link rel="stylesheet" href="./creator-command.css?v=15.0.0">
  <link rel="stylesheet" href="./grail-intelligence.css?v=15.0.0">
  <link rel="stylesheet" href="./journey-engine.css?v=15.0.0">
  <title>VaultSignal • Collector Intelligence OS</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <img src="./icon.svg" class="app-icon" alt="VaultSignal">
      <div class="brand-copy">
        <strong>VaultSignal</strong>
        <span>Collector OS • by 2GEN RIPS</span>
      </div>
      <div class="status-pill" id="connectionPill"><i></i><span>Collector OS</span></div>
    </header>

    <main id="main">
      <section id="home" class="screen active"></section>
      <section id="stock" class="screen"></section>
      <section id="discover" class="screen"></section>
      <section id="vault" class="screen"></section>
      <section id="tools" class="screen"></section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="active" data-tab="home"><span class="nav-icon">⌂</span><span>Home</span></button>
      <button data-tab="stock"><span class="nav-icon">◎</span><span>Stock</span></button>
      <button data-tab="discover"><span class="nav-icon">⌕</span><span>Search</span></button>
      <button data-tab="vault"><span class="nav-icon">▣</span><span>Vault</span></button>
      <button data-tab="tools"><span class="nav-icon">✦</span><span>Tools</span></button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <input id="hiddenImport" hidden type="file" accept="application/json">
    <input id="hiddenCamera" hidden type="file" accept="image/jpeg,image/png,image/webp" capture="environment">
  </div>
  <script defer src="./config.js?v=15.0.0"></script>
  <script defer src="./cloud.js"></script>
  <script defer src="./app.js?v=15.0.0"></script>
  <script defer src="./creator-command.js?v=15.0.0"></script>
  <script defer src="./grail-intelligence.js?v=15.0.0"></script>
  <script defer src="./journey-engine.js?v=15.0.0"></script>
</body>
</html>
