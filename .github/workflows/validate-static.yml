name: Validate VaultSignal Static Build

on:
  pull_request:
  push:
    branches: [main, v24-scout-proof]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check cloud-compat-v18.js
          node --check cloud.js
          node --check config.js
          node --check creator-command.js
          node --check grail-intelligence.js
          node --check journey-engine.js
          node --check vaultgraph.js
          node --check signal-network.js
          node --check live-community.js
          node --check mobile-command-center.js
          node --check signal-alert-engine.js
          node --check signal-fusion.js
          node --check source-mesh.js
          node --check demand-radar.js
          node --check hunt-missions.js
          node --check scout-proof.js
          node --check sw.js

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Signal Push Edge Function
        run: deno check --config supabase/functions/signal-push/deno.json supabase/functions/signal-push/index.ts

      - name: Check Source Mesh Edge Function
        run: deno check --config supabase/functions/source-mesh/deno.json supabase/functions/source-mesh/index.ts

      - name: Verify v24 Scout Proof release
        run: |
          grep -q 'scout-proof.css' index.html
          grep -q 'scout-proof.js' index.html
          grep -q 'scout-proof.css' sw.js
          grep -q 'scout-proof.js' sw.js
          grep -q 'vaultsignal-scout-proof-v240' sw.js
          grep -q 'appVersion: "24.0.0"' config.js
          grep -q 'releaseChannel: "scout-proof"' config.js
          grep -q 'VaultSignalScoutProof' scout-proof.js
          grep -q 'hunt_scout_trust' scout-proof.js
          grep -q 'data-mcc="proof"' mobile-command-center.js
          grep -q "case 'proof'" mobile-command-center.js
          grep -q 'verification_state' supabase/scout-proof-v24.sql
          grep -q 'SOURCE_VERIFIED' supabase/scout-proof-v24.sql
          grep -q 'CORROBORATED' supabase/scout-proof-v24.sql
          grep -q 'CONFLICTED' supabase/scout-proof-v24.sql
          grep -q 'claim_count>=3' supabase/scout-proof-v24.sql
          grep -q 'vaultsignal-scout-proof-refresh' supabase/scout-proof-v24.sql
          grep -q 'dispatch_latest_hunt_source_verification' supabase/scout-proof-v24-push-hardening.sql
          grep -q "new.verification_state='SOURCE_VERIFIED'" supabase/scout-proof-v24-push-hardening.sql
          grep -q 'proofState' supabase/functions/signal-push/index.ts
          grep -q 'proofLabels' supabase/functions/signal-push/index.ts
          grep -q 'conflicted claim stays in app' supabase/functions/signal-push/index.ts
          grep -q 'hunt_missions' supabase/hunt-missions-v23.sql
          grep -q 'source_observations' supabase/source-mesh-v21.sql
          grep -q "addEventListener('push'" sw.js
          grep -q 'webPushPublicKey: "B' config.js
          test -f V24-SCOUT-PROOF.md
          test -f scout-proof.css
          test -f scout-proof.js
          test -f supabase/scout-proof-v24.sql
          test -f supabase/scout-proof-v24-push-hardening.sql
          test -f supabase/functions/source-mesh/index.ts
          test -f supabase/functions/source-mesh/deno.json
          test -f supabase/functions/signal-push/index.ts
          test -f supabase/functions/signal-push/deno.json
