name: Validate VaultSignal Static Build

on:
  pull_request:
  push:
    branches: [main, v19-signal-alert-engine]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check cloud-compat-v18.js
          node --check cloud.js
          node --check config.js
          node --check creator-command.js
          node --check grail-intelligence.js
          node --check journey-engine.js
          node --check vaultgraph.js
          node --check signal-network.js
          node --check live-community.js
          node --check mobile-command-center.js
          node --check signal-alert-engine.js
          node --check sw.js

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Signal Push Edge Function
        run: deno check --config supabase/functions/signal-push/deno.json supabase/functions/signal-push/index.ts

      - name: Verify v19 assets are wired
        run: |
          grep -q 'signal-alert-engine.css' index.html
          grep -q 'signal-alert-engine.js' index.html
          grep -q 'signal-alert-engine.css' sw.js
          grep -q 'signal-alert-engine.js' sw.js
          grep -q 'vaultsignal-signal-alert-v190' sw.js
          grep -q 'appVersion: "19.0.0"' config.js
          grep -q 'releaseChannel: "signal-alert-engine"' config.js
          grep -q 'webPushPublicKey: "B' config.js
          grep -q 'VaultSignalAlerts' signal-alert-engine.js
          grep -q 'watch_terms' supabase/signal-alert-engine-v19.sql
          grep -q 'signal_push_deliveries' supabase/signal-alert-engine-v19.sql
          grep -q 'dispatch_vaultsignal_push' supabase/signal-alert-engine-v19.sql
          grep -q 'vaultsignal_push_config' supabase/functions/signal-push/index.ts
          grep -q 'min_score' supabase/functions/signal-push/index.ts
          grep -q 'watch_terms' supabase/functions/signal-push/index.ts
          grep -q "addEventListener('push'" sw.js
          grep -q 'supabasePublishableKey' config.js
          test -f V19-SIGNAL-ALERT-ENGINE.md
          test -f supabase/signal-network-v17.sql
          test -f supabase/live-community-v18.sql
          test -f supabase/signal-alert-engine-v19.sql
          test -f supabase/functions/signal-push/index.ts
          test -f supabase/functions/signal-push/deno.json
