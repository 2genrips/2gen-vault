name: Validate VaultSignal Static Build

on:
  pull_request:
  push:
    branches: [main, v18-2-mobile-command-center]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check cloud-compat-v18.js
          node --check cloud.js
          node --check config.js
          node --check creator-command.js
          node --check grail-intelligence.js
          node --check journey-engine.js
          node --check vaultgraph.js
          node --check signal-network.js
          node --check live-community.js
          node --check mobile-command-center.js
          node --check sw.js

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Signal Push Edge Function
        run: deno check --config supabase/functions/signal-push/deno.json supabase/functions/signal-push/index.ts

      - name: Verify v18.2 assets are wired
        run: |
          grep -q 'mobile-layout-hotfix.css' index.html
          grep -q 'mobile-command-center.css' index.html
          grep -q 'mobile-command-center.js' index.html
          grep -q 'mobile-command-center.css' sw.js
          grep -q 'mobile-command-center.js' sw.js
          grep -q 'vaultsignal-mobile-command-v182' sw.js
          grep -q 'appVersion: "18.2.0"' config.js
          grep -q 'releaseChannel: "mobile-command-center"' config.js
          grep -q 'mcc-top-button' mobile-command-center.css
          grep -q 'data-mcc="signals"' mobile-command-center.js
          grep -q 'VaultSignalMobileCommand' mobile-command-center.js
          grep -q "addEventListener('push'" sw.js
          grep -q 'supabasePublishableKey' config.js
          test -f supabase/signal-network-v17.sql
          test -f supabase/live-community-v18.sql
          test -f supabase/functions/signal-push/index.ts
          test -f supabase/functions/signal-push/deno.json
