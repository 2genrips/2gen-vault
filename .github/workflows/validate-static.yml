name: Validate VaultSignal Static Build

on:
  pull_request:
  push:
    branches: [main, v25-store-intel]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check cloud-compat-v18.js
          node --check cloud.js
          node --check config.js
          node --check creator-command.js
          node --check grail-intelligence.js
          node --check journey-engine.js
          node --check vaultgraph.js
          node --check signal-network.js
          node --check live-community.js
          node --check mobile-command-center.js
          node --check signal-alert-engine.js
          node --check signal-fusion.js
          node --check source-mesh.js
          node --check demand-radar.js
          node --check hunt-missions.js
          node --check scout-proof.js
          node --check store-intel.js
          node --check sw.js

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Signal Push Edge Function
        run: deno check --config supabase/functions/signal-push/deno.json supabase/functions/signal-push/index.ts

      - name: Check Source Mesh Edge Function
        run: deno check --config supabase/functions/source-mesh/deno.json supabase/functions/source-mesh/index.ts

      - name: Check Store Push Edge Function
        run: deno check --config supabase/functions/store-push/deno.json supabase/functions/store-push/index.ts

      - name: Verify v25 Store Intel release
        run: |
          grep -q 'store-intel.css' index.html
          grep -q 'store-intel.js' index.html
          grep -q 'store-intel.css' sw.js
          grep -q 'store-intel.js' sw.js
          grep -q 'vaultsignal-store-intel-v250' sw.js
          grep -q 'appVersion: "25.0.0"' config.js
          grep -q 'releaseChannel: "store-intel"' config.js
          grep -q 'VaultSignalStoreIntel' store-intel.js
          grep -q 'store_intel_follows' store-intel.js
          grep -q "q.get('store')" store-intel.js
          grep -q 'data-mcc="store"' mobile-command-center.js
          grep -q "case 'store'" mobile-command-center.js
          grep -q 'store_intel' supabase/store-intel-v25.sql
          grep -q 'store_intel_follows' supabase/store-intel-v25.sql
          grep -q 'store_intel_label_safe' supabase/store-intel-v25.sql
          grep -q 'vaultsignal-store-intel-refresh' supabase/store-intel-v25.sql
          grep -q 'trusted_claims' supabase/store-intel-v25.sql
          grep -q 'SOURCE_VERIFIED' supabase/store-intel-v25.sql
          grep -q 'CORROBORATED' supabase/store-intel-v25.sql
          grep -q 'vaultsignal_store_http_dispatch' supabase/store-intel-v25-push.sql
          grep -q 'store-push' supabase/store-intel-v25-push.sql
          grep -q "new.verification_state='SOURCE_VERIFIED'" supabase/store-intel-v25-push.sql
          grep -q 'on conflict(store_key) do update' supabase/store-intel-v25-refresh-hardening.sql
          ! grep -q '^  delete from public.store_intel;$' supabase/store-intel-v25-refresh-hardening.sql
          grep -q 'store_intel_follows' supabase/functions/store-push/index.ts
          grep -q "CORROBORATED','SOURCE_VERIFIED" supabase/functions/store-push/index.ts
          grep -q 'store followers require trusted proof' supabase/functions/store-push/index.ts
          grep -q 'eventKey=' supabase/functions/store-push/index.ts
          grep -q 'verification_state' supabase/scout-proof-v24.sql
          grep -q 'claim_count>=3' supabase/scout-proof-v24.sql
          grep -q "addEventListener('push'" sw.js
          grep -q 'webPushPublicKey: "B' config.js
          test -f V25-STORE-INTEL.md
          test -f store-intel.css
          test -f store-intel.js
          test -f supabase/store-intel-v25.sql
          test -f supabase/store-intel-v25-push.sql
          test -f supabase/store-intel-v25-refresh-hardening.sql
          test -f supabase/functions/store-push/index.ts
          test -f supabase/functions/store-push/deno.json
          test -f supabase/functions/source-mesh/index.ts
          test -f supabase/functions/signal-push/index.ts
