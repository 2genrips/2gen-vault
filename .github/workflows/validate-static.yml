name: Validate VaultSignal Static Build

on:
  pull_request:
  push:
    branches: [main, v22-demand-radar]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check cloud-compat-v18.js
          node --check cloud.js
          node --check config.js
          node --check creator-command.js
          node --check grail-intelligence.js
          node --check journey-engine.js
          node --check vaultgraph.js
          node --check signal-network.js
          node --check live-community.js
          node --check mobile-command-center.js
          node --check signal-alert-engine.js
          node --check signal-fusion.js
          node --check source-mesh.js
          node --check demand-radar.js
          node --check sw.js

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Signal Push Edge Function
        run: deno check --config supabase/functions/signal-push/deno.json supabase/functions/signal-push/index.ts

      - name: Check Source Mesh Edge Function
        run: deno check --config supabase/functions/source-mesh/deno.json supabase/functions/source-mesh/index.ts

      - name: Verify v22 assets are wired
        run: |
          grep -q 'demand-radar.css' index.html
          grep -q 'demand-radar.js' index.html
          grep -q 'demand-radar.css' sw.js
          grep -q 'demand-radar.js' sw.js
          grep -q 'vaultsignal-demand-radar-v220' sw.js
          grep -q 'appVersion: "22.0.0"' config.js
          grep -q 'releaseChannel: "demand-radar"' config.js
          grep -q 'VaultSignalDemandRadar' demand-radar.js
          grep -q 'data-mcc="radar"' mobile-command-center.js
          grep -q 'demand_radar' supabase/demand-radar-v22.sql
          grep -q 'count(distinct user_id) >= 3' supabase/demand-radar-v22.sql
          grep -q 'refresh_demand_radar_safe' supabase/demand-radar-v22-quality.sql
          grep -q 'source_observations' supabase/source-mesh-v21.sql
          grep -q 'source_catalog' supabase/source-mesh-v21.sql
          grep -q 'dispatch_source_mesh_refresh' supabase/source-mesh-v21-automation.sql
          grep -q 'local_verify' supabase/functions/source-mesh/index.ts
          grep -q 'global_refresh' supabase/functions/source-mesh/index.ts
          grep -q "addEventListener('push'" sw.js
          grep -q 'webPushPublicKey: "B' config.js
          test -f V22-DEMAND-RADAR.md
          test -f supabase/demand-radar-v22.sql
          test -f supabase/demand-radar-v22-quality.sql
          test -f supabase/source-mesh-v21.sql
          test -f supabase/source-mesh-v21-automation.sql
          test -f supabase/functions/source-mesh/index.ts
          test -f supabase/functions/source-mesh/deno.json
          test -f supabase/functions/signal-push/index.ts
          test -f supabase/functions/signal-push/deno.json
