name: Validate VaultSignal Static Build

on:
  pull_request:
  push:
    branches: [main, v20-signal-fusion]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check cloud-compat-v18.js
          node --check cloud.js
          node --check config.js
          node --check creator-command.js
          node --check grail-intelligence.js
          node --check journey-engine.js
          node --check vaultgraph.js
          node --check signal-network.js
          node --check live-community.js
          node --check mobile-command-center.js
          node --check signal-alert-engine.js
          node --check signal-fusion.js
          node --check sw.js

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Signal Push Edge Function
        run: deno check --config supabase/functions/signal-push/deno.json supabase/functions/signal-push/index.ts

      - name: Verify v20 assets are wired
        run: |
          grep -q 'signal-fusion.css' index.html
          grep -q 'signal-fusion.js' index.html
          grep -q 'signal-fusion.css' sw.js
          grep -q 'signal-fusion.js' sw.js
          grep -q 'vaultsignal-signal-fusion-v200' sw.js
          grep -q 'appVersion: "20.0.0"' config.js
          grep -q 'releaseChannel: "signal-fusion"' config.js
          grep -q 'VaultSignalFusion' signal-fusion.js
          grep -q 'data-mcc="fusion"' mobile-command-center.js
          grep -q 'signal_incidents' supabase/signal-fusion-v20.sql
          grep -q 'fuse_and_dispatch_signal_post' supabase/signal-fusion-v20.sql
          grep -q 'refresh_incident_after_reaction' supabase/signal-fusion-v20.sql
          grep -q 'event_key' supabase/signal-fusion-v20.sql
          grep -q 'set search_path = pg_catalog' supabase/signal-fusion-v20-search-path-hardening.sql
          grep -q 'incident_id' supabase/functions/signal-push/index.ts
          grep -q 'eventKey' supabase/functions/signal-push/index.ts
          grep -q "addEventListener('push'" sw.js
          grep -q 'webPushPublicKey: "B' config.js
          test -f V20-SIGNAL-FUSION.md
          test -f supabase/signal-network-v17.sql
          test -f supabase/live-community-v18.sql
          test -f supabase/signal-alert-engine-v19.sql
          test -f supabase/signal-fusion-v20.sql
          test -f supabase/signal-fusion-v20-search-path-hardening.sql
          test -f supabase/functions/signal-push/index.ts
          test -f supabase/functions/signal-push/deno.json
