name: Validate VaultSignal Static Build

on:
  pull_request:
  push:
    branches: [main, v18-live-community]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check cloud-compat-v18.js
          node --check cloud.js
          node --check config.js
          node --check creator-command.js
          node --check grail-intelligence.js
          node --check journey-engine.js
          node --check vaultgraph.js
          node --check signal-network.js
          node --check live-community.js
          node --check sw.js

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Signal Push Edge Function
        run: deno check --config supabase/functions/signal-push/deno.json supabase/functions/signal-push/index.ts

      - name: Verify v18 assets are wired
        run: |
          grep -q 'creator-command.css' index.html
          grep -q 'grail-intelligence.css' index.html
          grep -q 'journey-engine.css' index.html
          grep -q 'vaultgraph.css' index.html
          grep -q 'signal-network.css' index.html
          grep -q 'live-community.css' index.html
          grep -q 'cloud-compat-v18.js' index.html
          grep -q 'signal-network.js' index.html
          grep -q 'live-community.js' index.html
          grep -q 'live-community.js' sw.js
          grep -q 'live-community.css' sw.js
          grep -q "addEventListener('push'" sw.js
          grep -q 'appVersion: "18.0.0"' config.js
          grep -q 'supabasePublishableKey' config.js
          grep -q 'webPushPublicKey' config.js
          test -f supabase/signal-network-v17.sql
          test -f supabase/live-community-v18.sql
          test -f supabase/functions/signal-push/index.ts
          test -f supabase/functions/signal-push/deno.json
