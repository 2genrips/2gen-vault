name: Validate VaultSignal Static Build

on:
  pull_request:
  push:
    branches: [main, v23-hunt-missions]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check cloud-compat-v18.js
          node --check cloud.js
          node --check config.js
          node --check creator-command.js
          node --check grail-intelligence.js
          node --check journey-engine.js
          node --check vaultgraph.js
          node --check signal-network.js
          node --check live-community.js
          node --check mobile-command-center.js
          node --check signal-alert-engine.js
          node --check signal-fusion.js
          node --check source-mesh.js
          node --check demand-radar.js
          node --check hunt-missions.js
          node --check sw.js

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Signal Push Edge Function
        run: deno check --config supabase/functions/signal-push/deno.json supabase/functions/signal-push/index.ts

      - name: Check Source Mesh Edge Function
        run: deno check --config supabase/functions/source-mesh/deno.json supabase/functions/source-mesh/index.ts

      - name: Verify v23 assets are wired
        run: |
          grep -q 'hunt-missions.css' index.html
          grep -q 'hunt-missions.js' index.html
          grep -q 'hunt-missions.css' sw.js
          grep -q 'hunt-missions.js' sw.js
          grep -q 'vaultsignal-hunt-missions-v230' sw.js
          grep -q 'appVersion: "23.0.0"' config.js
          grep -q 'releaseChannel: "hunt-missions"' config.js
          grep -q 'VaultSignalHuntMissions' hunt-missions.js
          grep -q "q.get('mission')" hunt-missions.js
          grep -q 'data-mcc="hunt"' mobile-command-center.js
          grep -q 'hunt_missions' supabase/hunt-missions-v23.sql
          grep -q 'hunt_mission_scouts' supabase/hunt-missions-v23.sql
          grep -q 'hunt_mission_checkins' supabase/hunt-missions-v23.sql
          grep -q 'hunt_region_safe' supabase/hunt-missions-v23.sql
          grep -q 'active mission limit reached' supabase/hunt-missions-v23.sql
          grep -q 'join the mission before checking in' supabase/hunt-missions-v23.sql
          grep -q 'close_hunt_mission' supabase/hunt-missions-v23.sql
          grep -q 'dispatch_hunt_mission_checkin' supabase/hunt-missions-v23-push.sql
          grep -q 'mission_checkin_id' supabase/hunt-missions-v23-push.sql
          grep -q 'mission owner remains on the scout team' supabase/hunt-missions-v23-hardening.sql
          grep -q 'security invoker' supabase/hunt-missions-v23-security-hardening.sql
          grep -q 'guard_hunt_mission_client_update' supabase/hunt-missions-v23-security-hardening.sql
          grep -q 'select auth.uid()' supabase/hunt-missions-v23-performance.sql
          grep -q 'hunt_missions_created_by_idx' supabase/hunt-missions-v23-performance.sql
          grep -q 'missionMode' supabase/functions/signal-push/index.ts
          grep -q 'HUNT' supabase/functions/signal-push/index.ts
          grep -q 'demand_radar' supabase/demand-radar-v22.sql
          grep -q 'source_observations' supabase/source-mesh-v21.sql
          grep -q "addEventListener('push'" sw.js
          grep -q 'webPushPublicKey: "B' config.js
          test -f V23-HUNT-MISSIONS.md
          test -f hunt-missions.css
          test -f hunt-missions.js
          test -f supabase/hunt-missions-v23.sql
          test -f supabase/hunt-missions-v23-push.sql
          test -f supabase/hunt-missions-v23-hardening.sql
          test -f supabase/hunt-missions-v23-security-hardening.sql
          test -f supabase/hunt-missions-v23-performance.sql
          test -f supabase/functions/source-mesh/index.ts
          test -f supabase/functions/source-mesh/deno.json
          test -f supabase/functions/signal-push/index.ts
          test -f supabase/functions/signal-push/deno.json
